# When maintainer focus is ON (open issue labeled `maintainer-working`):
#   - Outside HUMANS: still allowed (warning comment)
#   - Outside AI agents / coding bots: blocked (comment + close PR)
# When focus is OFF: outside AI agents allowed.
# Owner (mitunmanav) never blocked. Dependabot always allowed.
#
# Turn ON/OFF: Actions → Agent guard → Run workflow → true/false
# (creates or closes the status issue — no secrets needed)

name: Agent guard

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:
    inputs:
      working:
        description: 'Maintainer focus lock'
        required: true
        type: choice
        options:
          - "true"
          - "false"

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  set-lock:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Toggle maintainer-working status issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALUE: ${{ inputs.working }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"
          if [ "${VALUE}" = "true" ]; then
            existing=$(gh issue list --repo "$REPO" \
              --label "maintainer-working" --state open \
              --json number --jq '.[0].number // empty')
            if [ -n "${existing}" ]; then
              echo "Already ON (issue #${existing})"
              exit 0
            fi
            gh issue create --repo "$REPO" \
              --title "🚧 Maintainer working — outside AI agents pause" \
              --label "maintainer-working" \
              --body "$(cat <<'EOF'
          ## Status: maintainer focus ON

          Mitun is actively working on this repo.

          | Who | Rule |
          |-----|------|
          | Outside **humans** | Welcome — small PRs OK |
          | Outside **AI agents / coding bots** | **Paused** until this issue is closed |
          | Maintainer | Full access |
          | Dependabot | Allowed |

          ### Turn OFF
          Actions → **Agent guard** → Run workflow → `false`  
          Or just **close this issue**.
          EOF
          )"
            echo "Focus ON"
          else
            nums=$(gh issue list --repo "$REPO" \
              --label "maintainer-working" --state open \
              --json number --jq '.[].number')
            if [ -z "${nums}" ]; then
              echo "Already OFF"
              exit 0
            fi
            for n in $nums; do
              gh issue close "$n" --repo "$REPO" \
                --comment "Maintainer focus **OFF**. Outside AI agents welcome again."
            done
            echo "Focus OFF"
          fi

  guard:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Enforce agent pause when maintainer working
        uses: actions/github-script@v9
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const author = pr.user?.login || "";
            const authorType = pr.user?.type || "User";

            if (author === owner || pr.author_association === "OWNER" || pr.author_association === "MEMBER") {
              core.info("Privileged author — allow");
              return;
            }

            // Focus = any open issue with label maintainer-working
            const openFocus = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo,
              state: "open",
              labels: "maintainer-working",
              per_page: 10,
            });
            // listForRepo returns issues AND pull requests; only count non-PR issues
            const focusIssues = openFocus.filter(i => !i.pull_request);
            if (focusIssues.length === 0) {
              core.info("Focus OFF — allow all");
              return;
            }

            const body = `${pr.title || ""}\n${pr.body || ""}`;
            const botName = /\[bot\]$/i.test(author) || authorType === "Bot";
            const packageBot = /^(dependabot|renovate)(\[bot\])?$/i.test(author);
            const agentName = /copilot|codex|devin|cursor|swe-agent|openhands|aider|codegen|factory|multi-agent/i.test(author);
            const agentMarkers = [
              /co-authored-by:\s*(copilot|chatgpt|claude|cursor|devin|codex)/i,
              /generated by (copilot|chatgpt|claude|cursor|devin|codex|an ai)/i,
              /<!--\s*copilot\s*-->/i,
              /\bai[- ]generated pr\b/i,
              /\bcoding agent\b/i,
              /openai codex/i,
              /claude code/i,
            ].some(re => re.test(body));

            const isAgent = packageBot ? false : (botName || agentName || agentMarkers);

            if (!isAgent) {
              await github.rest.issues.createComment({
                owner, repo,
                issue_number: pr.number,
                body: [
                  "### Maintainer focus is ON",
                  "",
                  "Outside **human** contributors are still welcome.",
                  "Mitun is actively working — review may be slower.",
                  "",
                  "Outside **AI coding agents** are paused until focus ends",
                  `(see issue #${focusIssues[0].number}).`,
                ].join("\n"),
              });
              try {
                await github.rest.issues.addLabels({
                  owner, repo, issue_number: pr.number, labels: ["human-contributor"],
                });
              } catch (_) {}
              return;
            }

            try {
              await github.rest.issues.addLabels({
                owner, repo, issue_number: pr.number,
                labels: ["ai-agent", "blocked-during-focus"],
              });
            } catch (_) {}

            await github.rest.issues.createComment({
              owner, repo,
              issue_number: pr.number,
              body: [
                "### Outside AI agent paused",
                "",
                "Maintainer focus is **ON**.",
                "",
                "| | |",
                "|---|---|",
                "| Outside humans | Allowed |",
                "| Outside AI agents | **Not allowed while Mitun is working** |",
                "",
                "Please re-open after focus ends, or have a human submit a small PR.",
                "",
                `Focus issue: #${focusIssues[0].number}`,
                "Or: Actions → **Agent guard** → Run workflow → `false`.",
              ].join("\n"),
            });

            await github.rest.pulls.update({
              owner, repo, pull_number: pr.number, state: "closed",
            });
            core.setFailed("Outside AI agent PR closed during maintainer focus");
