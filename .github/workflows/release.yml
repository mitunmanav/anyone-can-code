name: Release Plugin

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag matches plugin version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          PLUGIN_MANIFEST="plugins/anyone-can-code/.codex-plugin/plugin.json"
          if [[ ! -f "${PLUGIN_MANIFEST}" ]]; then
            echo "Missing plugin manifest at ${PLUGIN_MANIFEST}."
            exit 1
          fi
          VERSION="$(python - <<'PY'
          import json
          import os
          import sys
          manifest = os.environ.get("PLUGIN_MANIFEST")
          if not manifest:
              print("PLUGIN_MANIFEST is not set.")
              sys.exit(1)
          try:
              with open(manifest, "r", encoding="utf-8") as f:
                  data = json.load(f)
          except json.JSONDecodeError as exc:
              print(f"Invalid plugin manifest JSON in {manifest}: {exc}")
              sys.exit(1)
          version = data.get("version")
          if not version:
              print(f"Missing 'version' in plugin manifest {manifest}.")
              sys.exit(1)
          print(version)
          PY
          )"
          if [[ "v${VERSION}" != "${TAG}" ]]; then
            echo "Tag ${TAG} does not match plugin version v${VERSION}."
            exit 1
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "ARCHIVE=anyone-can-code-${TAG}.zip" >> "$GITHUB_ENV"
          echo "CHECKSUM=anyone-can-code-${TAG}.zip.sha256" >> "$GITHUB_ENV"

      - name: Package plugin
        shell: bash
        run: |
          set -euo pipefail
          cd plugins
          zip -r "../${ARCHIVE}" anyone-can-code \
            -x "*/__pycache__/*" "*.pyc"
          cd ..
          sha256sum "${ARCHIVE}" > "${CHECKSUM}"

      - name: Publish release assets
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ARCHIVE}" "${CHECKSUM}" --clobber
          else
            gh release create "${TAG}" "${ARCHIVE}" "${CHECKSUM}" \
              --title "Anyone Can Code ${TAG}" \
              --notes "Automated release for ${TAG}."
          fi
