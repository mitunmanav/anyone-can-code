name: Release Plugin

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate tag matches plugin version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          VERSION="$(python - <<'PY'
          import json
          with open("plugins/anyone-can-code/.codex-plugin/plugin.json", "r", encoding="utf-8") as f:
              print(json.load(f)["version"])
          PY
          )"
          if [[ "v${VERSION}" != "${TAG}" ]]; then
            echo "Tag ${TAG} does not match plugin version v${VERSION}."
            exit 1
          fi
          echo "TAG=${TAG}" >> "$GITHUB_ENV"
          echo "ARCHIVE=anyone-can-code-${TAG}.zip" >> "$GITHUB_ENV"
          echo "CHECKSUM=anyone-can-code-${TAG}.zip.sha256" >> "$GITHUB_ENV"

      - name: Package plugin
        shell: bash
        run: |
          set -euo pipefail
          cd plugins
          zip -r "../${ARCHIVE}" anyone-can-code \
            -x "*/__pycache__/*" "*.pyc"
          cd ..
          sha256sum "${ARCHIVE}" > "${CHECKSUM}"

      - name: Publish release assets
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${TAG}" >/dev/null 2>&1; then
            gh release upload "${TAG}" "${ARCHIVE}" "${CHECKSUM}" --clobber
          else
            gh release create "${TAG}" "${ARCHIVE}" "${CHECKSUM}" \
              --title "Anyone Can Code ${TAG}" \
              --notes "Automated release for ${TAG}."
          fi
