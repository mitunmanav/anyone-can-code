name: Bug report
description: Report a reproducible problem with Anyone Can Code.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What went wrong?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the command, skill, or workflow that triggered the issue.
      placeholder: |
        1. Add marketplace...
        2. Install plugin...
        3. Run $setup...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: "1.0.0"
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Paste relevant doctor output after removing private data.
      render: text
