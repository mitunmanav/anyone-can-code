name: Bug report
description: Something broke or behaved wrong.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: What went wrong?
      description: One or two sentences.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, in order.
      placeholder: |
        1. Added marketplace
        2. Installed plugin
        3. Ran $setup
        4. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: What actually happened
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      placeholder: "1.1.0-beta.3"
  - type: input
    id: env
    attributes:
      label: Environment
      description: OS + Codex (Desktop version if known)
      placeholder: "Windows 11 · Codex Desktop"
  - type: textarea
    id: diagnostics
    attributes:
      label: Doctor output (optional)
      description: Paste after removing private data. Run doctor.py --json if you can.
      render: text
