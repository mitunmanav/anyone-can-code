name: Feature request
description: Suggest an improvement.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or missing today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Idea
      description: What should change?
    validations:
      required: true
  - type: textarea
    id: nontechnical
    attributes:
      label: Who does this help?
      description: Especially useful for non-technical users?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives
      description: Simpler options or tradeoffs?
