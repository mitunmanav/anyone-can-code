name: Technical help
description: Offer engineering help or a technical improvement.
title: "[Technical]: "
labels:
  - help wanted
body:
  - type: textarea
    id: area
    attributes:
      label: Area
      description: Which part of the project?
      placeholder: "MCP memory, Windows setup, tests, release, prompts, docs..."
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggestion
      description: What should change, and why?
    validations:
      required: true
  - type: textarea
    id: explanation
    attributes:
      label: Plain-language explanation
      description: So a non-technical maintainer can decide.
    validations:
      required: true
  - type: textarea
    id: risks
    attributes:
      label: Risks or tradeoffs
      description: What could break or get more complex?
