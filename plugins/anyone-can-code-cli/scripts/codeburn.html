<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Codex Usage Dashboard</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background: #0a0e14; color: #e6e6e6; padding: 24px; min-height: 100vh;
  }
  .container { max-width: 1100px; margin: 0 auto; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #0a0e14; }
  ::-webkit-scrollbar-thumb { background: #2d3748; border-radius: 3px; }

  .header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:12px; }
  .header h1 { font-size:20px; font-weight:600; color:#e6e6e6; }
  .header .sub { font-size:12px; color:#6b7685; }
  .status { display:flex; align-items:center; gap:6px; font-size:12px; color:#6b7685; }
  .dot { width:7px; height:7px; border-radius:50%; display:inline-block; }
  .dot.green { background:#3fb950; box-shadow:0 0 6px rgba(63,185,80,0.4); }
  .dot.red { background:#f85149; box-shadow:0 0 6px rgba(248,81,73,0.4); }

  .period-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:8px; }
  .period-tabs { display:flex; gap:4px; background:#151b23; border-radius:10px; padding:3px; }
  .period-tabs button { background:transparent; color:#6b7685; border:none; padding:6px 16px; font-size:12px; border-radius:8px; cursor:pointer; transition:all .15s; font-family:inherit; }
  .period-tabs button:hover { color:#e6e6e6; }
  .period-tabs button.active { background:#1f6feb; color:#fff; box-shadow:0 0 12px rgba(31,111,235,0.3); }

  .overview { display:grid; grid-template-columns:repeat(auto-fit,minmax(130px,1fr)); gap:10px; margin-bottom:16px; }
  .card { background:linear-gradient(135deg,#151b23,#1a2230); border:1px solid #1e293b; border-radius:12px; padding:14px; text-align:center; }
  .card .label { font-size:10px; color:#6b7685; text-transform:uppercase; letter-spacing:.8px; font-weight:600; }
  .card .value { font-size:24px; font-weight:700; margin-top:4px; letter-spacing:-.5px; }
  .card .value.blue { color:#58a6ff; } .card .value.green { color:#3fb950; }
  .card .value.yellow { color:#d29922; } .card .value.purple { color:#bc8cff; }
  .card .value.orange { color:#f0883e; }

  .panel-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:12px; }
  @media(max-width:800px){ .panel-grid{grid-template-columns:1fr} }
  .panel { background:linear-gradient(135deg,#151b23,#181e2a); border:1px solid #1e293b; border-radius:12px; padding:16px; }
  .panel.full { grid-column:1/-1; }
  .panel h2 { font-size:12px; color:#6b7685; text-transform:uppercase; letter-spacing:.8px; font-weight:600; margin-bottom:12px; display:flex; align-items:center; gap:8px; }
  .panel h2 .bar { width:3px; height:14px; border-radius:2px; }

  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { padding:6px 8px; text-align:left; border-bottom:1px solid #1e293b; }
  th { color:#6b7685; font-weight:500; font-size:10px; letter-spacing:.5px; text-transform:uppercase; }
  td { color:#c9d1d9; }
  tr:hover td { background:rgba(31,111,235,.04); }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }

  .tool-bar { display:flex; align-items:center; gap:8px; }
  .tool-bar .bg { background:#1e293b; border-radius:4px; height:8px; flex:1; min-width:60px; overflow:hidden; }
  .tool-bar .fill { height:100%; border-radius:4px; transition:width .4s; }

  .sess-row { display:flex; align-items:center; padding:7px 0; border-bottom:1px solid #1e293b; gap:8px; cursor:pointer; }
  .sess-row:hover { background:rgba(31,111,235,.04); border-radius:6px; padding:7px 4px; }
  .sess-row .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:12px; color:#c9d1d9; }
  .sess-row .tag { font-size:10px; padding:1px 6px; border-radius:4px; background:rgba(31,111,235,.1); color:#58a6ff; }
  .sess-row .meta { font-size:10px; color:#6b7685; }
  .sess-row .tok { font-size:12px; font-weight:600; color:#58a6ff; }

  .os-badge { display:inline-flex; align-items:center; gap:4px; padding:2px 8px; border-radius:10px; font-size:10px; font-weight:600; }
  .os-badge.high { background:rgba(63,185,80,.12); color:#3fb950; }
  .os-badge.ok { background:rgba(210,153,34,.12); color:#d29922; }
  .os-badge.low { background:rgba(248,81,73,.12); color:#f85149; }

  .daily-chart { display:flex; gap:6px; align-items:flex-end; min-height:80px; padding:8px 0 0; }
  .daily-bar { flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; }
  .daily-bar .bar { width:100%; min-height:4px; border-radius:4px 4px 0 0; transition:height .4s; background:linear-gradient(to top,#1f6feb,#58a6ff); }
  .daily-bar .lbl { font-size:9px; color:#6b7685; }
  .daily-bar .val { font-size:9px; color:#c9d1d9; font-weight:500; }

  .btn { background:#1f6feb; color:#fff; border:none; padding:5px 14px; border-radius:8px; font-size:11px; cursor:pointer; font-family:inherit; }
  .btn:hover { background:#388bfd; }

  .modal-bg { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.6); backdrop-filter:blur(4px); z-index:100; align-items:center; justify-content:center; }
  .modal-bg.open { display:flex; }
  .modal { background:#151b23; border:1px solid #1e293b; border-radius:16px; padding:24px; max-width:480px; width:90%; max-height:80vh; overflow-y:auto; }
  .modal .x { float:right; background:none; border:none; color:#6b7685; font-size:18px; cursor:pointer; padding:4px 8px; }
  .modal .x:hover { color:#e6e6e6; }
  .modal h3 { font-size:15px; color:#e6e6e6; margin-bottom:10px; }

  .empty { color:#3d4a5c; font-size:13px; text-align:center; padding:16px 0; }
  .footer { text-align:center; padding:16px 0 0; margin-top:16px; border-top:1px solid #1e293b; font-size:11px; color:#3d4a5c; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div><h1>Codex Usage</h1><div class="sub">Read from your local sessions · 0 token cost</div></div>
    <div class="status"><span class="dot green" id="dot"></span><span id="status">Connected</span><span style="color:#3d4a5c;margin-left:8px;" id="count"></span></div>
  </div>

  <div class="period-row">
    <div class="period-tabs">
      <button class="active" data-p="today">Today</button>
      <button data-p="week">7 Days</button>
      <button data-p="30d">30 Days</button>
      <button data-p="month">Month</button>
      <button data-p="all">All</button>
    </div>
    <div style="display:flex;align-items:center;gap:10px;">
      <span style="font-size:10px;color:#3d4a5c;"><kbd style="background:#151b23;padding:1px 5px;border-radius:3px;">1</kbd>-<kbd style="background:#151b23;padding:1px 5px;border-radius:3px;">5</kbd> periods</span>
      <span style="font-size:10px;color:#3d4a5c;">Updated: <span id="updated">—</span></span>
      <button class="btn" onclick="downloadReport()">Download Report</button>
    </div>
  </div>

  <div class="overview" id="overview"></div>

  <div class="panel-grid">
    <div class="panel">
      <h2><span class="bar" style="background:#f0883e;"></span>Sessions</h2>
      <div id="sessions-panel"></div>
    </div>
    <div class="panel">
      <h2><span class="bar" style="background:#58a6ff;"></span>Projects</h2>
      <div id="projects-panel"></div>
    </div>
    <div class="panel">
      <h2><span class="bar" style="background:#3fb950;"></span>Activity</h2>
      <div id="activity-panel"></div>
    </div>
    <div class="panel">
      <h2><span class="bar" style="background:#bc8cff;"></span>AI Model</h2>
      <div id="model-panel"></div>
    </div>
    <div class="panel">
      <h2><span class="bar" style="background:#d29922;"></span>Tools Used</h2>
      <div id="tools-panel"></div>
    </div>
    <div class="panel">
      <h2><span class="bar" style="background:#58a6ff;"></span>Daily Trend</h2>
      <div id="daily-panel"></div>
    </div>
  </div>

  <div class="footer">Codex Usage Dashboard · Data from <code>~/.codex/sessions/</code> · Auto-refresh every 3s</div>
</div>

<div class="modal-bg" id="modal" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <button class="x" onclick="closeModal()">&times;</button>
    <h3 id="modal-title">Session Details</h3>
    <div id="modal-body"></div>
  </div>
</div>

<script>
let period = 'today', sessions = [];

async function get(u) { const r=await fetch(u); return r.json(); }

function f(n) {
  if(typeof n!=='number') return '0';
  if(n>=1e9) return (n/1e9).toFixed(2)+'B';
  if(n>=1e6) return (n/1e6).toFixed(1)+'M';
  if(n>=1e3) return (n/1e3).toFixed(1)+'K';
  return String(n);
}

// Overview
function overview(r) {
  const o=r.overview;
  document.getElementById('overview').innerHTML =
    `<div class="card"><div class="label">Sessions</div><div class="value blue">${o.sessions}</div></div>
     <div class="card"><div class="label">Total Tokens</div><div class="value">${f(o.total_tokens)}</div></div>
     <div class="card"><div class="label">Input</div><div class="value green">${f(o.total_input)}</div></div>
     <div class="card"><div class="label">Output</div><div class="value purple">${f(o.total_output)}</div></div>
     <div class="card"><div class="label">Cached</div><div class="value yellow">${f(o.total_cached)}</div></div>
     <div class="card"><div class="label">Cache Hit</div><div class="value orange">${o.cache_hit_pct}%</div></div>`;
}

// Sessions list
function sessionsPanel(r) {
  const d=document.getElementById('sessions-panel');
  if(!r.top_sessions||!r.top_sessions.length){d.innerHTML='<div class="empty">No sessions yet</div>';return;}
  let h='';
  for(let i=0;i<Math.min(r.top_sessions.length,10);i++){
    const s=r.top_sessions[i];
    h+=`<div class="sess-row" onclick="showSession('${s.key.replace(/'/g,"\\'")}')">
      <span class="tag">${s.activity||'?'}</span>
      <span class="name">${s.filename.slice(0,30)}</span>
      <span class="meta">${s.model}</span>
      <span class="meta">${s.date}</span>
      <span class="tok">${f(s.tokens)}</span>
    </div>`;
  }
  d.innerHTML=h;
}

// Projects
function projectsPanel(r) {
  const d=document.getElementById('projects-panel');
  if(!r.projects||!r.projects.length){d.innerHTML='<div class="empty">No project data</div>';return;}
  const maxT=Math.max(...r.projects.map(p=>p.tokens));
  let h='<table><thead><tr><th>Project</th><th class="num">Sessions</th><th class="num">Tokens</th></tr></thead><tbody>';
  for(const p of r.projects){
    const pct=maxT>0?p.tokens/maxT*100:0;
    h+=`<tr>
      <td><div style="display:flex;align-items:center;gap:6px;"><div style="width:${Math.max(3,pct)}px;height:10px;border-radius:3px;background:#58a6ff;flex-shrink:0;"></div>${p.project||'unknown'}</div></td>
      <td class="num">${p.sessions}</td>
      <td class="num">${f(p.tokens)}</td>
    </tr>`;
  }
  h+='</tbody></table>';
  d.innerHTML=h;
}

// Activity
function activityPanel(r) {
  const d=document.getElementById('activity-panel');
  if(!r.activities||!r.activities.length){d.innerHTML='<div class="empty">No data</div>';return;}
  let h='<table><thead><tr><th>Activity</th><th class="num">Sessions</th><th class="num">%</th><th class="num">1st Try</th></tr></thead><tbody>';
  for(const a of r.activities){
    let cls='high'; if(a.oneshot_rate>0&&a.oneshot_rate<50) cls='low'; else if(a.oneshot_rate>0&&a.oneshot_rate<80) cls='ok';
    const os=a.oneshot_rate>0?`<span class="os-badge ${cls}">${a.oneshot_rate}%</span>`:'<span style="color:#3d4a5c;">—</span>';
    h+=`<tr><td>${a.activity}</td><td class="num">${a.sessions}</td><td class="num">${a.pct}%</td><td class="num">${os}</td></tr>`;
  }
  h+='</tbody></table>';
  d.innerHTML=h;
}

// Model
function modelPanel(r) {
  const d=document.getElementById('model-panel');
  if(!r.models||!r.models.length){d.innerHTML='<div class="empty">No data</div>';return;}
  const cols=['#58a6ff','#3fb950','#d29922','#bc8cff','#f0883e'];
  let h='<table><thead><tr><th>Model</th><th class="num">Sess</th><th class="num">Input</th><th class="num">Output</th><th class="num">Cached</th></tr></thead><tbody>';
  r.models.forEach((m,i)=>{
    h+=`<tr><td><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${cols[i%5]};margin-right:6px;"></span>${m.model}</td>
      <td class="num">${m.sessions}</td><td class="num">${f(m.input)}</td><td class="num">${f(m.output)}</td><td class="num">${f(m.cached)}</td></tr>`;
  });
  h+='</tbody></table>';
  d.innerHTML=h;
}

// Tools
function toolsPanel(r) {
  const d=document.getElementById('tools-panel');
  if(!r.tools||!r.tools.length){d.innerHTML='<div class="empty">No tools used</div>';return;}
  const bc=['#58a6ff','#3fb950','#d29922','#bc8cff','#f0883e','#f85149'];
  const max=Math.max(...r.tools.map(t=>t.calls));
  let h='<table><thead><tr><th>Tool</th><th class="num">Calls</th><th>Usage</th></tr></thead><tbody>';
  r.tools.forEach((t,i)=>{
    const p=max>0?t.calls/max*100:0;
    const c=bc[i%6];
    h+=`<tr><td><span style="display:inline-block;width:8px;height:8px;border-radius:2px;background:${c};margin-right:6px;"></span>${t.tool}</td>
      <td class="num">${t.calls}</td>
      <td><div class="tool-bar"><div class="bg"><div class="fill" style="width:${p}%;background:${c};box-shadow:0 0 6px ${c}40;"></div></div><span style="font-size:10px;color:#6b7685;width:30px;text-align:right;">${t.pct}%</span></div></td></tr>`;
  });
  h+='</tbody></table>';
  d.innerHTML=h;
}

// Daily
function dailyPanel(r) {
  const d=document.getElementById('daily-panel');
  if(!r.daily||!r.daily.length){d.innerHTML='<div class="empty">No data</div>';return;}
  const days=r.daily.slice(0,14).reverse();
  const max=Math.max(...days.map(x=>x.tokens));
  let h='<div class="daily-chart">';
  for(const x of days){
    const p=max>0?x.tokens/max*100:0;
    h+=`<div class="daily-bar" title="${x.date}: ${x.tokens.toLocaleString()} tokens, ${x.sessions} sessions">
      <div class="val">${f(x.tokens)}</div>
      <div class="bar" style="height:${Math.max(4,p)}px;"></div>
      <div class="lbl">${x.date.slice(5)}</div>
    </div>`;
  }
  h+='</div>';
  d.innerHTML=h;
}

// Session detail modal
function showSession(key) {
  const s=sessions.find(x=>x.key===key);
  if(!s)return;
  document.getElementById('modal-title').textContent=s.filename.slice(0,40);
  const tools=Object.entries(s.tool_calls||{}).map(([t,c])=>`<tr><td>${t}</td><td class="num">${c}</td></tr>`).join('');
  document.getElementById('modal-body').innerHTML=`
    <table style="margin-bottom:12px;">
      <tr><td style="color:#6b7685;">Date</td><td>${s.date}</td></tr>
      <tr><td style="color:#6b7685;">Model</td><td>${s.model}</td></tr>
      <tr><td style="color:#6b7685;">Activity</td><td>${s.activity||'—'}</td></tr>
      <tr><td style="color:#6b7685;">Project</td><td>${s.project||'—'}</td></tr>
      <tr><td style="color:#6b7685;">Input</td><td>${(s.total_input||0).toLocaleString()} tokens</td></tr>
      <tr><td style="color:#6b7685;">Output</td><td>${(s.total_output||0).toLocaleString()} tokens</td></tr>
      <tr><td style="color:#6b7685;">Cached Input</td><td>${(s.total_cached||0).toLocaleString()} tokens</td></tr>
      <tr><td style="color:#6b7685;">Total</td><td style="font-weight:600;color:#58a6ff;">${(s.total_tokens||0).toLocaleString()} tokens</td></tr>
      <tr><td style="color:#6b7685;">Duration</td><td>${dur(s.duration_secs)}</td></tr>
    </table>
    ${tools?'<h4 style="font-size:12px;color:#6b7685;text-transform:uppercase;letter-spacing:.5px;margin-bottom:6px;">Tools used in this session</h4><table><thead><tr><th>Tool</th><th class="num">Calls</th></tr></thead><tbody>'+tools+'</tbody></table>':''}
  `;
  document.getElementById('modal').classList.add('open');
}
function closeModal(){document.getElementById('modal').classList.remove('open');}
function dur(s){if(!s)return'—';if(s<60)return Math.round(s)+'s';if(s<3600)return Math.floor(s/60)+'m '+Math.round(s%60)+'s';return Math.floor(s/3600)+'h '+Math.floor((s%3600)/60)+'m';}

// Download
function downloadReport() {
  fetch(`/api/export?period=${period}`).then(r=>r.json()).then(d=>{
    const b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(b);a.download=`codex-report-${period}-${new Date().toISOString().slice(0,10)}.json`;
    a.click();URL.revokeObjectURL(a.href);
  });
}

// Refresh
async function refresh() {
  try{
    const[r,s]=await Promise.all([get(`/api/report?period=${period}`),get('/api/sessions')]);
    sessions=s;
    overview(r);sessionsPanel(r);projectsPanel(r);activityPanel(r);modelPanel(r);toolsPanel(r);dailyPanel(r);
    document.getElementById('updated').textContent=new Date().toLocaleTimeString();
    document.getElementById('count').textContent=r.overview.sessions+' sessions';
    document.getElementById('dot').className='dot green';document.getElementById('status').textContent='Connected';
  }catch(e){
    document.getElementById('dot').className='dot red';document.getElementById('status').textContent='Disconnected';
  }
}

// Period tabs
document.querySelectorAll('.period-tabs button').forEach(b=>{
  b.addEventListener('click',()=>{
    period=b.dataset.p;
    document.querySelector('.period-tabs .active')?.classList.remove('active');
    b.classList.add('active');refresh();
  });
});

// Keyboard
document.addEventListener('keydown',e=>{
  const p=['today','week','30d','month','all'],i=parseInt(e.key)-1;
  if(i>=0&&i<5){const b=document.querySelector(`[data-p="${p[i]}"]`);if(b)b.click();}
  if(e.key==='Escape')closeModal();
});

refresh();
setInterval(refresh,3000);
</script>
</body>
</html>
