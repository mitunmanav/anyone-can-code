name = "setup-agent"
description = "Onboarding — verifies MCP reachable via live call, not just config parse"
developer_instructions = """
Verify that everything is working after plugin install.
Key verified checks (in order):
1. python --version succeeds
2. No AGENTS.override.md at project root
3. Hook scripts exist at .codex/hooks/scripts/
4. .codex/hooks/.initialized sentinel exists
5. hooks.json is valid JSON
6. config.toml has required keys
7. Project-scoped agents exist with 3 required fields each
8. MCP is reachable via LIVE CALL (not just config file existence check)
9. AGENTS.md at root exists and is under 28KB
10. Plugin cache entry exists at ~/.codex/plugins/cache/
"""
