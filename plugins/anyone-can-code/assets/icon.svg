<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="anyonecancode plugin icon">
  <defs>
    <linearGradient id="bg" x1="140" y1="90" x2="850" y2="930" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#10151f"/>
      <stop offset="0.55" stop-color="#05070b"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="purple" x1="255" y1="224" x2="820" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#8d7cff"/>
      <stop offset="0.45" stop-color="#6f50ff"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="22" stdDeviation="28" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="102" y="102" width="820" height="820" rx="190" fill="url(#bg)" filter="url(#shadow)"/>
  <rect x="250" y="286" width="520" height="390" rx="58" fill="none" stroke="url(#purple)" stroke-width="26" stroke-linecap="round" filter="url(#glow)"/>
  <path d="M250 384 H770" stroke="#1f2530" stroke-width="44" opacity="0.72"/>

  <circle cx="304" cy="336" r="22" fill="#8d7cff" filter="url(#glow)"/>
  <circle cx="365" cy="336" r="22" fill="#8d7cff" filter="url(#glow)"/>
  <circle cx="426" cy="336" r="22" fill="#8d7cff" filter="url(#glow)"/>

  <path d="M360 491 L450 575 L360 659" fill="none" stroke="url(#purple)" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M519 636 H610" stroke="#ffffff" stroke-width="34" stroke-linecap="round" opacity="0.95"/>

  <g filter="url(#glow)">
    <path d="M690 641 v122 c0 52 43 95 95 95 h0 c52 0 95-43 95-95 V641" fill="url(#purple)"/>
    <path d="M710 641 V540" stroke="url(#purple)" stroke-width="36" stroke-linecap="round"/>
    <path d="M860 641 V540" stroke="url(#purple)" stroke-width="36" stroke-linecap="round"/>
    <path d="M785 858 V960" stroke="url(#purple)" stroke-width="36" stroke-linecap="round"/>
  </g>
</svg>
